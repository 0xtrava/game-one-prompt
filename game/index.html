<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEON SNAKE — built from one prompt</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #07070f;
    color: #e8fff0;
    font-family: "JetBrains Mono", "Courier New", monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  header { width: 100%; max-width: 980px; padding: 10px 40px 10px; text-align: center; }
  h1 {
    font-size: 64px; letter-spacing: 10px; font-weight: 800;
    color: #39ff6a;
    text-shadow: 0 0 18px rgba(57,255,106,.85), 0 0 60px rgba(57,255,106,.45);
  }
  h1 .pink { color: #ff2d78; text-shadow: 0 0 18px rgba(255,45,120,.85), 0 0 60px rgba(255,45,120,.45); }
  .sub { margin-top: 8px; font-size: 24px; letter-spacing: 4px; color: #8f9bb3; }
  .hud {
    width: 100%; max-width: 980px; padding: 18px 40px 6px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .hud .label { font-size: 22px; letter-spacing: 3px; color: #8f9bb3; }
  .hud .value { font-size: 52px; font-weight: 800; color: #fff; text-shadow: 0 0 16px rgba(57,255,106,.7); }
  .hud .best { font-size: 30px; color: #ffd166; }
  #wrap { position: relative; width: min(96vw, 1040px); }
  canvas {
    display: block; width: 100%; aspect-ratio: 1 / 1;
    background: #0a0a18;
    border: 3px solid #1d2b4a; border-radius: 18px;
    box-shadow: 0 0 0 2px #0e1526, 0 0 45px rgba(57,255,106,.22), inset 0 0 60px rgba(0,0,0,.6);
    touch-action: none;
  }
  #overlay {
    position: absolute; inset: 0; border-radius: 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(5,5,14,.82); text-align: center; z-index: 2;
  }
  #overlay h2 { font-size: 58px; letter-spacing: 6px; color: #ff2d78; text-shadow: 0 0 22px rgba(255,45,120,.8); }
  #overlay p { margin-top: 14px; font-size: 26px; color: #cdd7ea; letter-spacing: 2px; }
  #overlay .big { margin-top: 10px; font-size: 34px; color: #fff; }
  #overlay button {
    margin-top: 30px; font-family: inherit; font-size: 30px; font-weight: 800; letter-spacing: 3px;
    color: #07130a; background: #39ff6a; border: none; border-radius: 12px;
    padding: 18px 44px; cursor: pointer;
    box-shadow: 0 0 28px rgba(57,255,106,.65);
  }
  #badge {
    position: absolute; top: 14px; right: 14px; z-index: 3;
    font-size: 20px; font-weight: 800; letter-spacing: 2px;
    color: #07130a; background: #ffd166; border-radius: 8px; padding: 8px 14px;
    box-shadow: 0 0 18px rgba(255,209,102,.7);
  }
  #stats {
    display: flex; justify-content: space-between;
    padding: 20px 12px 0; text-align: center;
  }
  #stats .label { font-size: 22px; letter-spacing: 3px; color: #8f9bb3; }
  #stats .stat { font-size: 40px; font-weight: 800; color: #7ee0ff; text-shadow: 0 0 14px rgba(126,224,255,.6); }
  footer { margin-top: 0; padding: 26px 20px 10px; text-align: center; }
  footer .keys { font-size: 24px; letter-spacing: 3px; color: #8f9bb3; }
  footer .keys b { color: #e8fff0; }
  footer .tag { margin-top: 10px; font-size: 22px; letter-spacing: 4px; color: #39ff6a; }
</style>
</head>
<body>
<header>
  <h1>NEON <span class="pink">SNAKE</span></h1>
  <div class="sub">ONE PROMPT &middot; ONE FILE &middot; ZERO SETUP</div>
</header>
<div class="hud">
  <div><span class="label">SCORE</span><br><span class="value" id="score">0</span></div>
  <div style="text-align:right"><span class="label">BEST</span><br><span class="best" id="best">0</span></div>
</div>
<div id="wrap">
  <div id="badge" hidden>AUTO-PLAY</div>
  <canvas id="game" width="900" height="900"></canvas>
  <div id="overlay">
    <h2 id="ovTitle">NEON SNAKE</h2>
    <p id="ovText">Eat the orbs. Don't hit the walls<br>or your own tail.</p>
    <p class="big" id="ovScore" hidden></p>
    <button id="startBtn">▶&nbsp; PLAY</button>
  </div>
  <div id="stats">
    <div><span class="label">ORBS</span><br><span class="stat" id="orbs">0</span></div>
    <div><span class="label">SPEED</span><br><span class="stat" id="speed">1.0&times;</span></div>
    <div><span class="label">LENGTH</span><br><span class="stat" id="len">3</span></div>
  </div>
</div>
<footer>
  <div class="keys"><b>↑ ↓ ← →</b> or <b>WASD</b> to steer &nbsp;·&nbsp; <b>R</b> to restart &nbsp;·&nbsp; swipe on mobile</div>
  <div class="tag">BUILT BY AN AI AGENT FROM ONE PROMPT</div>
</footer>
<script>
(function () {
  'use strict';
  var COLS = 20, ROWS = 20, CELL = 900 / COLS;
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var orbsEl = document.getElementById('orbs');
  var speedEl = document.getElementById('speed');
  var lenEl = document.getElementById('len');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovText = document.getElementById('ovText');
  var ovScore = document.getElementById('ovScore');
  var startBtn = document.getElementById('startBtn');
  var badge = document.getElementById('badge');

  var demo = new URLSearchParams(location.search).get('demo') === '1';
  if (demo) badge.hidden = false;

  var snake, dir, pending, food, score, best = 0, alive = false, over = false;
  var tickMs = 125, timer = null, hue = 0, orbs = 0;

  function refreshStats() {
    orbsEl.textContent = String(orbs);
    speedEl.textContent = (125 / tickMs).toFixed(1) + '×';
    lenEl.textContent = String(snake.length);
  }

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 }; pending = [];
    score = 0; scoreEl.textContent = '0';
    tickMs = 125; over = false; orbs = 0;
    refreshStats();
    placeFood();
  }

  function placeFood() {
    var p;
    do {
      p = { x: (Math.random() * COLS) | 0, y: (Math.random() * ROWS) | 0 };
    } while (snake.some(function (s) { return s.x === p.x && s.y === p.y; }));
    food = p;
  }

  function step() {
    if (!alive) return;
    if (demo) dir = aiDir();
    while (pending.length) {
      var d = pending.shift();
      if (d.x !== -dir.x || d.y !== -dir.y) { dir = d; break; }
    }
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS ||
        snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
      return gameOver();
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      orbs += 1;
      scoreEl.textContent = String(score);
      if (score > best) { best = score; bestEl.textContent = String(best); }
      if (tickMs > 70) tickMs -= 3;
      refreshStats();
      placeFood();
    } else {
      snake.pop();
    }
    draw();
    clearTimeout(timer);
    timer = setTimeout(step, tickMs);
  }

  // Demo driver: greedy chase with a one-step safety check, so the game
  // plays itself and keeps going (auto-restarts after game over).
  function aiDir() {
    var head = snake[0];
    var cands = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }]
      .filter(function (d) { return d.x !== -dir.x || d.y !== -dir.y; });
    function safe(d) {
      var nx = head.x + d.x, ny = head.y + d.y;
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return false;
      return !snake.some(function (s, i) {
        return i < snake.length - 1 && s.x === nx && s.y === ny;
      });
    }
    var ok = cands.filter(safe);
    if (!ok.length) return dir;
    ok.sort(function (a, b) {
      var da = Math.abs(head.x + a.x - food.x) + Math.abs(head.y + a.y - food.y);
      var db = Math.abs(head.x + b.x - food.x) + Math.abs(head.y + b.y - food.y);
      return da - db;
    });
    return ok[0];
  }

  function draw() {
    hue = (hue + 0.6) % 360;
    ctx.clearRect(0, 0, 900, 900);
    // grid
    ctx.strokeStyle = 'rgba(80,120,255,0.10)';
    ctx.lineWidth = 1;
    for (var i = 1; i < COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, 900); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(900, i * CELL); ctx.stroke();
    }
    // food: pulsing neon orb
    var pulse = 1 + 0.12 * Math.sin(Date.now() / 180);
    var fx = food.x * CELL + CELL / 2, fy = food.y * CELL + CELL / 2;
    var r = CELL * 0.32 * pulse;
    var g = ctx.createRadialGradient(fx, fy, 1, fx, fy, r * 2.2);
    g.addColorStop(0, 'rgba(255,45,120,0.95)');
    g.addColorStop(0.35, 'rgba(255,45,120,0.55)');
    g.addColorStop(1, 'rgba(255,45,120,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(fx, fy, r * 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff5c9e';
    ctx.beginPath(); ctx.arc(fx, fy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(fx - r * 0.3, fy - r * 0.3, r * 0.28, 0, Math.PI * 2); ctx.fill();
    // snake: glowing segments, brighter head with eyes
    snake.forEach(function (s, i) {
      var px = s.x * CELL, py = s.y * CELL, pad = 3;
      var grad = ctx.createLinearGradient(px, py, px + CELL, py + CELL);
      grad.addColorStop(0, i === 0 ? '#a4ff5e' : '#39ff6a');
      grad.addColorStop(1, i === 0 ? '#39ff6a' : '#00c853');
      ctx.shadowColor = '#39ff6a';
      ctx.shadowBlur = 18;
      ctx.fillStyle = grad;
      roundRect(px + pad, py + pad, CELL - pad * 2, CELL - pad * 2, 10);
      ctx.fill();
      ctx.shadowBlur = 0;
      if (i === 0) {
        var ex = px + CELL / 2 + dir.x * 8, ey = py + CELL / 2 + dir.y * 8;
        var ox = -dir.y * 9, oy = dir.x * 9;
        ctx.fillStyle = '#07130a';
        ctx.beginPath(); ctx.arc(ex + ox, ey + oy, 5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex - ox, ey - oy, 5, 0, Math.PI * 2); ctx.fill();
      }
    });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function gameOver() {
    alive = false;
    clearTimeout(timer);
    over = true;
    ovTitle.textContent = 'GAME OVER';
    ovText.innerHTML = 'The snake crashed.<br>One prompt built all of this.';
    ovScore.hidden = false;
    ovScore.textContent = 'SCORE: ' + score + '  ·  BEST: ' + best;
    startBtn.textContent = '↻  PLAY AGAIN';
    overlay.style.display = 'flex';
    if (demo) setTimeout(start, 1400);
  }

  function start() {
    reset();
    overlay.style.display = 'none';
    alive = true;
    draw();
    clearTimeout(timer);
    timer = setTimeout(step, tickMs);
  }

  var KEYS = {
    ArrowUp: { x: 0, y: -1 }, KeyW: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 }, KeyS: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, KeyA: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 }, KeyD: { x: 1, y: 0 }
  };
  document.addEventListener('keydown', function (e) {
    if (e.code === 'KeyR' && over) return start();
    if (e.code === 'Enter' && !alive) return start();
    var d = KEYS[e.code];
    if (d) { e.preventDefault(); if (alive) pending.push(d); }
  });
  startBtn.addEventListener('click', start);

  var tx = 0, ty = 0;
  canvas.addEventListener('touchstart', function (e) {
    var t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY;
  }, { passive: true });
  canvas.addEventListener('touchend', function (e) {
    var t = e.changedTouches[0];
    var dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    var d = Math.abs(dx) > Math.abs(dy)
      ? { x: dx > 0 ? 1 : -1, y: 0 }
      : { x: 0, y: dy > 0 ? 1 : -1 };
    if (alive) pending.push(d);
  }, { passive: true });

  reset();
  draw();
  if (demo) start();
})();
</script>
</body>
</html>
